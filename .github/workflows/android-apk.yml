name: Build Android APK

# Builds the Capacitor Android app on an x86 runner and publishes the APK as a
# workflow artifact (and on a GitHub Release for v* tags).
#
# Signing: if the four ANDROID_* repo secrets are set, the APK is signed with
# the release key (android/KEYSTORE.md). Otherwise it is debug-signed so it is
# still installable - but it will NOT update over a release-signed install.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'
  # Same path filter, so APK-affecting PRs get a build before they merge.
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write # attach the APK to a GitHub Release on v* tags

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs the default ref is a synthetic merge commit that exists
          # nowhere in history, so an APK built from it is not reproducible and
          # its version would name a commit nobody can check out. Build the head
          # commit instead: the version, the artifact name and the PR's head SHA
          # then all agree.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One version for the whole job: the web bundle (via vite define) and the
      # APK's versionCode/versionName are stamped from these two env vars, so
      # what Settings shows cannot drift from what Android reports. --check
      # fails the build rather than shipping the 0.0.0-nogit fallback.
      - name: Resolve app version
        run: node scripts/app-version.mjs --check >> "$GITHUB_ENV"

      # Capacitor 8 / AGP 8.13 need JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Explicit packages: the action's default list includes the removed
      # 'tools' package, which makes sdkmanager fail. compileSdk is 36.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - run: npm ci
      - run: npm run cap:sync

      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            # Java .properties treats backslash as an escape character.
            esc() { printf '%s' "${1//\\/\\\\}"; }
            {
              printf 'storeFile=%s\n' "$keystore"
              printf 'storePassword=%s\n' "$(esc "$KEYSTORE_PASSWORD")"
              printf 'keyAlias=%s\n' "$(esc "$KEY_ALIAS")"
              printf 'keyPassword=%s\n' "$(esc "$KEY_PASSWORD")"
            } > android/keystore.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key from repo secrets."
          else
            echo "mode=debug-signed" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_* signing secrets not set - building a debug-signed APK."
          fi

      - name: Build release APK
        working-directory: android
        run: |
          set -- --no-daemon assembleRelease \
            -PappVersionCode="$APP_VERSION_CODE" \
            -PappVersionName="$APP_VERSION_NAME"
          if [ "${{ steps.signing.outputs.mode }}" != "release" ]; then
            set -- "$@" -PdebugSignRelease
          fi
          ./gradlew "$@"

      - name: Verify signature and version, name APK
        id: apk
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          src=android/app/build/outputs/apk/release/app-release.apk
          "${tools}apksigner" verify --verbose --print-certs "$src"

          # Assert the artifact really carries the version we asked for. A
          # silently-unstamped APK (the versionCode 1 bug) must fail the build,
          # not ship.
          # No pipes below: with pipefail, a reader that exits early (head/grep -q)
          # sends SIGPIPE upstream and the pipeline "fails" for the wrong reason.
          badging="$("${tools}aapt2" dump badging "$src")"
          if ! pkg="$(grep -m1 '^package: ' <<<"$badging")"; then
            echo "::error::aapt2 dump badging printed no 'package:' line for $src"
            exit 1
          fi
          got_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$pkg")"
          got_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$pkg")"
          echo "APK reports versionCode=$got_code versionName=$got_name"
          if [ "$got_code" != "$APP_VERSION_CODE" ] || [ "$got_name" != "$APP_VERSION_NAME" ]; then
            echo "::error::APK version mismatch - expected $APP_VERSION_NAME ($APP_VERSION_CODE)," \
                 "APK reports $got_name ($got_code)"
            exit 1
          fi

          # And assert the bundled web app agrees, so the version the board can
          # read in Settings is the version Android reports for the same file.
          bundle="$RUNNER_TEMP/bundle.js"
          if ! unzip -p "$src" 'assets/public/assets/*.js' > "$bundle"; then
            echo "::error::No web bundle at assets/public/assets/*.js inside $src"
            exit 1
          fi
          if ! grep -qF "$APP_VERSION_NAME" "$bundle"; then
            echo "::error::Bundled web app does not contain versionName $APP_VERSION_NAME -" \
                 "Settings would show a different version than the APK"
            exit 1
          fi

          # The versionCode is in this name on purpose. The in-app updater reads
          # it straight off the release asset to decide whether the release is
          # an upgrade over the running build (src/version.ts, parseApkName).
          # versionName alone cannot answer that: a tagged build is named
          # '1.2.0' and an untagged one '2026.09.29.a1b2c3d', and those two do
          # not sort against each other. Changing this format breaks the update
          # check - change parseApkName in the same commit.
          name="workout-tracker-${APP_VERSION_NAME}-${APP_VERSION_CODE}-${{ steps.signing.outputs.mode }}"
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$src" "$RUNNER_TEMP/apk/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/apk/$name.apk" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          {
            echo "## Android APK"
            echo
            echo "**Version:** \`$APP_VERSION_NAME\` &nbsp;·&nbsp; **versionCode:** \`$APP_VERSION_CODE\`"
            echo
            echo "This is what Android's app info and the app's Settings → About both report, so you can tell"
            echo "on the phone whether this build is installed."
            echo
            echo "**Artifact:** \`${{ steps.apk.outputs.name }}.apk\` (download from the Artifacts section of this run)"
            echo
            if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
              echo "Signed with the **release key**. Installs as an update over any previous release-signed install."
            else
              echo "> [!WARNING]"
              echo "> **Debug-signed APK.** The \`ANDROID_*\` signing secrets are not set, so this APK is signed with a"
              echo "> throwaway debug key. It installs fresh, but it will **not** update over a release-signed install"
              echo "> (uninstall first, which deletes on-device app data). Add the secrets - see \`android/KEYSTORE.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --generate-notes
          fi

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties
