apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing credentials live outside the repo. See android/KEYSTORE.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Version comes from the build, not from this file: scripts/app-version.mjs
// derives it from the commit and the workflow injects it with -P. Without the
// properties (a bare local ./gradlew build) we fall back to an obviously-local
// version rather than claiming to be a real build.
def appVersionCode = 1
if (project.hasProperty('appVersionCode')) {
    appVersionCode = project.property('appVersionCode').toString().toInteger()
    if (appVersionCode < 1) {
        // Fail loudly: a bad -P must not silently ship as versionCode 1.
        throw new GradleException("appVersionCode must be >= 1, got ${appVersionCode}")
    }
}
def appVersionName = project.findProperty('appVersionName') ?: '0.0.0-local'

android {
    namespace = "com.tuckerswett.workouttracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tuckerswett.workouttracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Falls back to unsigned if keystore.properties is missing, so the
            // build never fails for lack of a keystore - see android/KEYSTORE.md.
            // CI passes -PdebugSignRelease to get an installable debug-signed
            // APK instead (.github/workflows/android-apk.yml).
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            } else if (project.hasProperty('debugSignRelease')) {
                signingConfig signingConfigs.debug
            } else {
                signingConfig null
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Health Connect (SWE-31): reads steps/sleep/weight/body fat/resting HR.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidxLifecycleVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
