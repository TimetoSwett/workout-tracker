apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Single source of truth for the app version (TOM-2): the repo's package.json.
// The web build injects the same value as __APP_VERSION__ (see vite.config.ts),
// so the version string Settings shows is by construction the version of this
// artifact. CI asserts the built APK's versionName against package.json too.
def appVersionName = new groovy.json.JsonSlurper()
        .parse(rootProject.file("../package.json"))
        .version
def semver = (appVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/)
if (!semver.matches()) {
    throw new GradleException(
            "package.json version '${appVersionName}' must be MAJOR.MINOR.PATCH " +
            "so a monotonic Android versionCode can be derived from it.")
}
def versionMajor = semver[0][1] as int
def versionMinor = semver[0][2] as int
def versionPatch = semver[0][3] as int
// Android refuses to install a build whose versionCode does not increase, so
// this arithmetic has to be strictly increasing in semver order. It is - but
// only while minor and patch stay below 100. Fail the build loudly rather than
// ship an APK whose versionCode silently regressed and broke every future
// update. (Bump the multipliers here, never downward, if 100 is ever too few.)
if (versionMinor > 99 || versionPatch > 99) {
    throw new GradleException(
            "package.json version '${appVersionName}' would break monotonic versionCode: " +
            "minor and patch must each stay below 100 for major*10000 + minor*100 + patch " +
            "to keep increasing. Bump the major component instead.")
}
def appVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch

// Release signing credentials live outside the repo. See android/KEYSTORE.md.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.tuckerswett.workouttracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tuckerswett.workouttracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Falls back to unsigned if keystore.properties is missing, so the
            // build never fails for lack of a keystore - see android/KEYSTORE.md.
            // CI passes -PdebugSignRelease to get an installable debug-signed
            // APK instead (.github/workflows/android-apk.yml).
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            } else if (project.hasProperty('debugSignRelease')) {
                signingConfig signingConfigs.debug
            } else {
                signingConfig null
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Health Connect (SWE-31): reads steps/sleep/weight/body fat/resting HR.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$androidxLifecycleVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
